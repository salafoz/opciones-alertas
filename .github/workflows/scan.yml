name: Escaner de opciones

on:
  schedule:
    # Cada 15 min, lunes a viernes; el script descarta las ejecuciones fuera del horario de mercado USA.
    - cron: '7,22,37,52 13-21 * * 1-5'
  push:
    branches: [main]
    paths: ['config/config.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: Recuperar estado anterior
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:state.json > out/state.json || rm -f out/state.json
          fi
      - name: Escanear
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python scanner/scan.py
      - name: Publicar datos en la rama data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          [ -f index.json ] || exit 0
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Datos $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
